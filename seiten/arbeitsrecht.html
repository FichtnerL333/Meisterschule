const L="ABCDE";

function pool(){

const $=id=>document.getElementById(id);

function renderChips(){

function renderBar(ids){

}

function renderCard(ids){

  });
  h+='</div>';
  if(a!==undefined){
    const ok=a===q[3];
    h+='<div class="explain '+(ok?"ok":"no")+'"><strong>'+(ok?"Richtig":"Falsch – richtig ist "+L[q[3]])+'</strong>'+q[4]+(q[5]?'<div class="law">'+q[5]+'</div>':'')+'</div>';
  }
  h+='<div class="nav"><button class="btn" id="prev" type="button"'+(st.pos===0?" disabled":"")+'>Zurück</button>'+
     '<button class="btn primary" id="next" type="button">'+(st.pos===ids.length-1?"Auswertung":"Weiter")+'</button></div>';
  card.innerHTML=h;
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(i,+b.dataset.k));
  $("prev").onclick=()=>{st.pos--;save();render();};
  $("next").onclick=()=>{st.pos++;save();render();};
}

function renderDone(ids){
  let g=0,r=0;ids.forEach(i=>{if(st.ans[i]===undefined)return;st.ans[i]===Q[i][3]?g++:r++;});
  let rows="";
  T.forEach((t,ti)=>{
    const tids=ids.filter(i=>Q[i][0]===ti);if(!tids.length)return;
    const tg=tids.filter(i=>st.ans[i]===Q[i][3]).length;
    rows+='<tr><td>'+t+'</td><td class="n">'+tg+' / '+tids.length+'</td></tr>';
  });
  const pct=ids.length?Math.round(g/ids.length*100):0;
  $("card").innerHTML='<div class="done"><span class="eyebrow">Auswertung</span><div class="big">'+pct+' %</div>'+
    '<p>'+g+' von '+ids.length+' richtig'+(r?', '+r+' falsch.':'.')+'</p>'+
    '<table><thead><tr><th>Thema</th><th class="n">richtig</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="nav"><button class="btn" id="back" type="button">Zur letzten Frage</button>'+
    (r?'<button class="btn primary" id="fix" type="button">Fehler nochmal üben</button>':'<button class="btn primary" id="again" type="button">Von vorn</button>')+'</div>';
  $("back").onclick=()=>{st.pos=ids.length-1;save();render();};
  if($("fix"))$("fix").onclick=()=>startRetry(ids);
  if($("again"))$("again").onclick=()=>{ids.forEach(i=>delete st.ans[i]);st.pos=0;save();render();};
}

function startRetry(ids){
  const w=ids.filter(i=>st.ans[i]!==undefined&&st.ans[i]!==Q[i][3]);
  w.forEach(i=>delete st.ans[i]);st.retry=w;st.pos=0;save();render();
}
function pick(i,k){if(st.ans[i]!==undefined)return;st.ans[i]=k;save();render();}

function render(){const ids=pool();if(st.pos>ids.length)st.pos=0;renderChips();renderBar(ids);renderCard(ids);}

$("shuffle").onclick=()=>{const a=Q.map((_,i)=>i);for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]];}
  st.order=a;st.pos=0;save();render();};
$("wrongOnly").onclick=()=>{if(st.retry){st.retry=null;st.pos=0;save();render();}else startRetry(pool());};
$("reset").onclick=()=>{st={ans:{},topics:T.map((_,i)=>i),order:null,pos:0,retry:null};save();render();};

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const ids=pool();if(st.pos>=ids.length)return;
  const k=L.indexOf(e.key.toUpperCase());
  if(k>=0&&k<5){pick(ids[st.pos],k);}
  else if(e.key==="Enter"&&st.ans[ids[st.pos]]!==undefined){e.preventDefault();st.pos++;save();render();}
});
render();
</script>
